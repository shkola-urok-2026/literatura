<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Расписание уроков — 5 класс</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fdfbf4; --ink:#1d2b64; --ink-soft:#3a4a8c;
    --mon:#e8735a; --tue:#6aa9e9; --wed:#4caf7d; --thu:#e9b53f; --fri:#9d7fd1;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Comfortaa','Segoe UI',sans-serif;
    background:repeating-linear-gradient(0deg,#f3ede0 0,#f3ede0 34px,#e7dfce 35px);
    color:var(--ink); padding:24px 12px 40px;
  }
  .wrap{max-width:760px;margin:0 auto}
  header{position:relative;text-align:center;margin-bottom:26px}
  h1{font-size:clamp(26px,6vw,42px);line-height:1.15;letter-spacing:.5px}
  h1 .cls{color:#e8735a}
  .underline{width:150px;height:6px;border-radius:6px;margin:14px auto 0;
    background:linear-gradient(90deg,#6aa9e9 50%,#4caf7d 50%)}
  .plane,.star,.pencil,.books{position:absolute;font-size:30px;opacity:.85}
  .plane{left:2%;top:-8px;transform:rotate(-18deg)}
  .star{right:4%;top:-6px}
  .books{left:1%;bottom:-6px}
  .pencil{right:2%;bottom:-10px;transform:rotate(24deg)}

  /* сегодняшняя дата */
  .today-line{text-align:center;font-size:15px;margin-bottom:18px;color:var(--ink-soft)}
  .today-line b{color:#e8735a}

  /* вкладки дней */
  .tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
  .tab{
    border:none;cursor:pointer;font-family:inherit;font-weight:700;
    font-size:15px;padding:10px 16px;border-radius:14px 14px 4px 4px;
    color:#fff;background:#b9c2d6;transition:transform .15s, box-shadow .15s;
  }
  .tab:hover{transform:translateY(-3px)}
  .tab.active{transform:translateY(-3px);box-shadow:0 6px 14px rgba(29,43,100,.25)}
  .tab.t-mon.active{background:var(--mon)} .tab.t-tue.active{background:var(--tue)}
  .tab.t-wed.active{background:var(--wed)} .tab.t-thu.active{background:var(--thu)}
  .tab.t-fri.active{background:var(--fri)}

  /* карточка дня */
  .day-card{
    background:var(--paper);border-radius:20px;padding:26px 22px;
    box-shadow:0 10px 30px rgba(29,43,100,.15);
    border:2px solid #e6ddc8;animation:pop .35s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .day-title{
    display:inline-block;color:#fff;font-weight:700;font-size:20px;
    padding:8px 26px;border-radius:12px;margin-bottom:18px;letter-spacing:.5px;
  }
  .lesson{
    display:flex;align-items:center;gap:12px;padding:11px 6px;
    border-bottom:1.5px dashed #d9d2bd;border-radius:8px;
  }
  .lesson:last-child{border-bottom:none}
  .lesson .time{
    font-weight:700;font-size:15px;min-width:118px;color:var(--ink-soft);
    white-space:nowrap;
  }
  .lesson .name{font-size:16.5px;font-weight:400}
  .lesson.now{
    background:#fff4d6;border:1.5px solid #e9b53f;
    box-shadow:0 3px 10px rgba(233,181,63,.25);
  }
  .lesson.now::before{content:'📌'}
  .lesson .dot{width:10px;height:10px;border-radius:50%;margin-left:auto;opacity:.75}

  /* прогресс дня */
  .progress{margin-top:18px;background:#eee7d6;border-radius:20px;height:14px;overflow:hidden}
  .progress>div{height:100%;background:linear-gradient(90deg,#6aa9e9,#4caf7d);border-radius:20px;transition:width .5s}
  .progress-label{font-size:13px;color:var(--ink-soft);text-align:center;margin-top:6px}

  footer{text-align:center;margin-top:26px;font-size:13px;color:var(--ink-soft)}
  footer .star{position:static;font-size:16px}

  @media(max-width:520px){
    .lesson{flex-wrap:wrap}
    .lesson .time{min-width:100%}
    .tab{font-size:13px;padding:9px 11px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="plane">✈️</span><span class="star">⭐</span>
    <h1>РАСПИСАНИЕ УРОКОВ — <span class="cls">5 КЛАСС</span></h1>
    <div class="underline"></div>
  </header>

  <div class="today-line" id="todayLine"></div>

  <div class="tabs" id="tabs"></div>
  <div class="day-card" id="dayCard"></div>

  <footer>
    <span class="books">📚</span>
    Нажми на день недели, чтобы посмотреть уроки &nbsp;<span class="pencil">✏️</span>
  </footer>
</div>

<script>
const DAYS = [
 {key:'mon', cls:'t-mon', name:'ПОНЕДЕЛЬНИК', color:'#e8735a', js:1, lessons:[
  ['8:30–8:50','Разговоры о важном'],
  ['9:00–9:20','История'],
  ['9:30–9:50','Иностранный язык (англ)'],
  ['10:10–10:30','Русский язык'],
  ['10:40–11:00','Математика'],
  ['11:10–11:30','Физическая культура']]},
 {key:'tue', cls:'t-tue', name:'ВТОРНИК', color:'#6aa9e9', js:2, lessons:[
  ['8:30–8:50','Литература'],
  ['9:00–9:20','Математика'],
  ['9:30–9:50','Русский язык'],
  ['10:10–10:30','География'],
  ['10:40–11:00','Труд (технология)'],
  ['11:10–11:30','ИЗО']]},
 {key:'wed', cls:'t-wed', name:'СРЕДА', color:'#4caf7d', js:3, lessons:[
  ['8:30–8:50','История'],
  ['9:00–9:20','Русский язык'],
  ['9:30–9:50','Математика'],
  ['10:10–10:30','Иностранный язык (англ)'],
  ['10:40–11:00','Литература'],
  ['11:10–11:30','Физическая культура']]},
 {key:'thu', cls:'t-thu', name:'ЧЕТВЕРГ', color:'#e9b53f', js:4, lessons:[
  ['8:30–8:50','История'],
  ['9:00–9:20','Математика'],
  ['9:30–9:50','Русский язык'],
  ['10:10–10:30','Биология'],
  ['10:40–11:00','Смысловое чтение'],
  ['11:10–11:30','Музыка']]},
 {key:'fri', cls:'t-fri', name:'ПЯТНИЦА', color:'#9d7fd1', js:5, lessons:[
  ['8:30–8:50','Углублённый курс биологии'],
  ['9:00–9:20','Русский язык'],
  ['9:30–9:50','Литература'],
  ['10:10–10:30','Математика'],
  ['10:40–11:00','Труд (технология)'],
  ['11:10–11:30','Модуль «Футбол для всех»']]}
];

const colors = {mon:'#e8735a',tue:'#6aa9e9',wed:'#4caf7d',thu:'#e9b53f',fri:'#9d7fd1'};
const tabsEl = document.getElementById('tabs');
const cardEl = document.getElementById('dayCard');

function parseEnd(t){
  const m = t.split('–')[1].split(':');
  return {h:+m[0], m:+m[1]};
}

function showDay(day){
  cardEl.innerHTML =
    `<span class="day-title" style="background:${day.color}">${day.name}</span>` +
    day.lessons.map(l=>`
      <div class="lesson" data-end="${l[0]}">
        <span class="time">${l[0]}</span>
        <span class="name">${l[1]}</span>
        <span class="dot" style="background:${day.color}"></span>
      </div>`).join('') +
    `<div class="progress"><div style="width:0%" id="bar"></div></div>
     <div class="progress-label" id="barLabel"></div>`;
  markNow(day);
  cardEl.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function markNow(day){
  const now = new Date();
  const jsDay = now.getDay();
  const cur = now.getHours()*60+now.getMinutes();
  let anyNow=false, past=0;
  document.querySelectorAll('.lesson').forEach((el,i)=>{
    const end = parseEnd(el.dataset.end);
    const endM = end.h*60+end.m;
    if(jsDay===day.js && cur<=endM && !anyNow){
      if(cur+5>=endM-20){ el.classList.add('now'); anyNow=true; }
    }
    if(cur>endM) past++;
  });
  const pct = Math.round(past/day.lessons.length*100);
  document.getElementById('bar').style.width = (jsDay===day.js?Math.min(pct,100):0)+'%';
  document.getElementById('barLabel').textContent =
    jsDay===day.js ? `Учебный день пройден на ${Math.min(pct,100)}% 💪` : '';
}

DAYS.forEach(day=>{
  const b=document.createElement('button');
  b.className=`tab ${day.cls}`;
  b.textContent=day.name.slice(0,3).replace('ПО','ПН');
  b.textContent = {mon:'ПН',tue:'ВТ',wed:'СР',thu:'ЧТ',fri:'ПТ'}[day.key];
  b.title=day.name;
  b.onclick=()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));b.classList.add('active');showDay(day);};
  tabsEl.appendChild(b);
});

// подсветка сегодняшнего дня
const now = new Date();
const today = DAYS.find(d=>d.js===now.getDay());
if(today){
  document.querySelectorAll('.tab')[DAYS.indexOf(today)].classList.add('active');
  showDay(today);
}else{
  document.querySelector('.tab').classList.add('active');
  showDay(DAYS[0]);
}
document.getElementById('todayLine').innerHTML =
  `Сегодня: <b>${now.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}</b> — вкладка сегодняшнего дня уже открыта 🎯`;
</script>
</body>
</html>
