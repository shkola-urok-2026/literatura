function card(a,i){const d=document.createElement("div");d.className="card";
d.innerHTML='<div class="ph" id="ph'+i+'"><div class="ava-txt">'+initials(a.n)+'</div></div>'+
'<div class="nm">'+a.n+'</div><div class="yr">'+a.y+'</div>'+
'<span class="tag">'+a.t[0]+(a.t.includes("зарубежный")?" · зарубежный":(a.t.includes("народы России")?" · народы России":""))+'</span>';
d.onclick=()=>openM(i);return d;}
function render(list){g.innerHTML="";list.forEach(a=>g.appendChild(card(a,A.indexOf(a))));}
render(A);
let cur="all";
document.querySelectorAll(".controls button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".controls button").forEach(x=>x.classList.remove("active"));b.classList.add("active");cur=b.dataset.f;apply();});
document.getElementById("search").oninput=apply;
function apply(){const q=document.getElementById("search").value.toLowerCase();
render(A.filter(a=>(cur==="all"||a.t.includes(cur))&&(a.n.toLowerCase().includes(q)||a.w.toLowerCase().includes(q))));}
function openM(i){const a=A[i];document.getElementById("mi").innerHTML='<div class="ava-txt">'+initials(a.n)+'</div>';
document.getElementById("mh").textContent=a.n;document.getElementById("my").textContent=a.y;
document.getElementById("mt").textContent=a.b;document.getElementById("mw").textContent=a.w;
const l=document.getElementById("ml");l.href=a.u;l.textContent="Узнать больше на Культуре.РФ →";
document.getElementById("m").style.display="block";}
function closeM(){document.getElementById("m").style.display="none";}
for(let i=0;i<TITLES.length;i+=10){
  const ch=TITLES.slice(i,i+10);
  const url="https://ru.wikipedia.org/w/api.php?action=query&format=json&formatversion=2&prop=pageimages&piprop=thumbnail&pithumbsize=400&origin=*&titles="+encodeURIComponent(ch.join("|"));
  fetch(url).then(r=>r.json()).then(d=>{((d.query&&d.query.pages)||[]).forEach(p=>{
    if(p.thumbnail&&p.thumbnail.source){A.forEach((a,idx)=>{if(a.p===p.title){
      const ph=document.getElementById("ph"+idx);
      if(ph)ph.innerHTML='<img class="ava" alt="'+a.n+'" src="'+p.thumbnail.source+'">';
    }});}
  });}).catch(()=>{});
}
let done=0,score=0;const qz=document.getElementById("qz");
Q.forEach((q,i)=>{const d=document.createElement("div");d.className="q";
d.innerHTML='<p><b>'+(i+1)+". "+q.q+'</b></p>';
q.o.forEach((o,j)=>{const lb=document.createElement("label");
lb.innerHTML='<input type="radio" name="q'+i+'" value="'+j+'"> '+o;
lb.querySelector("input").onchange=()=>{if(!d.dataset.done){d.dataset.done=1;done++;
if(j===q.a){score++;lb.style.color="#9be29b";}else lb.style.color="#f08a8a";
if(done===Q.length)document.getElementById("rz").textContent="Результат: "+score+" из "+Q.length+" ✦";}};
d.appendChild(lb);});
qz.appendChild(d);});
</script>
</body></html>
