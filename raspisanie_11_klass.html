<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Расписание 11 класс — естественно-научный профиль</title>
<style>
:root{
  --bg:#eef4f7; --card:#ffffff; --ink:#1f3a5f; --muted:#7d93ad;
  --accent:#4a7fb5; --ok:#3f9d6b; --shadow:0 8px 24px rgba(31,58,95,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:16px 12px 40px}
.wrap{max-width:640px;margin:0 auto}
header{text-align:center;margin-bottom:18px}
.badge{display:inline-block;background:linear-gradient(135deg,#4a7fb5,#3f9d6b);color:#fff;font-size:13px;font-weight:600;padding:6px 16px;border-radius:999px;letter-spacing:.4px}
h1{font-size:clamp(22px,6vw,30px);margin:10px 0 4px}
.sub{color:var(--muted);font-size:14px}
.today-chip{margin-top:8px;display:inline-block;background:#fff8e6;border:1px solid #f0d98c;color:#8a6d1f;font-size:13px;padding:5px 14px;border-radius:999px}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.tab{border:none;cursor:pointer;font-size:14px;font-weight:600;padding:10px 16px;border-radius:14px;background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(31,58,95,.08);transition:.2s}
.tab:hover{transform:translateY(-2px)}
.tab.active{background:var(--ink);color:#fff}
.tab.is-today{outline:2px solid var(--ok);outline-offset:2px}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;margin-top:6px}
.lesson{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px dashed #dbe6f0;opacity:0;transform:translateY(8px);animation:rise .35s ease forwards}
@keyframes rise{to{opacity:1;transform:none}}
.lesson:last-child{border-bottom:none}
.num{flex:0 0 34px;height:34px;border-radius:10px;background:#eaf2fa;color:var(--accent);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
.l-main{flex:1;min-width:0}
.l-name{font-weight:700;font-size:15.5px;line-height:1.3}
.l-time{color:var(--muted);font-size:12.5px;margin-top:2px}
.l-time b{color:var(--accent);font-weight:700}
.now{background:linear-gradient(90deg,#eafaf1,#ffffff);}
.now .num{background:var(--ok);color:#fff}
.now-tag{flex-shrink:0;background:var(--ok);color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.55}}
.empty{flex:0 0 auto;color:#b9c8d8;font-size:13px;font-style:italic;padding:13px 16px;text-align:center}
.progress{margin-top:18px;background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:14px 16px}
.progress .p-top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px}
.bar{height:10px;border-radius:999px;background:#e4edf5;overflow:hidden}
.fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#4a7fb5,#3f9d6b);transition:width 1s ease}
footer{text-align:center;color:var(--muted);font-size:12.5px;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <span class="badge">Естественно-научный профиль · 2026/27 · Октябрь</span>
  <h1>Расписание уроков — 11 класс</h1>
  <div class="sub">Сегодня знания — завтра возможности! 🍂</div>
  <div class="today-chip" id="chip">📅</div>
</header>
<div class="tabs" id="tabs"></div>
<div class="card" id="card"></div>
<div class="progress">
  <div class="p-top"><span id="p-label">Учебный день</span><b id="p-val">0%</b></div>
  <div class="bar"><div class="fill" id="fill"></div></div>
</div>
<footer>💡 Нажимай на вкладки — расписание само подскажет текущий урок</footer>
</div>
<script>
const DATA = {"Понедельник": ["Разговоры о важном", "Русский язык", "Биология", "Геометрия", "Практикум по биологии", "Иностранный язык (англ.)", "История", null], "Вторник": ["Литература", "Алгебра и начала математического анализа", "Химия", "Русский язык: теория и практика", "История", "ОБЗР", "Обществознание", null], "Среда": ["Русский язык в формате ЕГЭ", "Алгебра и начала математического анализа", "Химия", "Литература", "Биология", "Иностранный язык (англ.)", "География", "Модуль «Футбол для всех»"], "Четверг": ["Россия — мои горизонты", "Физическая культура", "Химия", "Информатика", "Обществознание", "Вероятность и статистика", "Литература", "В/Д Семьеведение"], "Пятница": ["Биология", "Алгебра и начала математического анализа", "Русский язык", "Иностранный язык (англ.)", "Физическая культура", "Физика", "Физика", null]};
const TIMES = ["8:30–8:50", "9:00–9:20", "9:30–9:50", "10:10–10:30", "10:40–11:00", "11:10–11:30", "11:40–12:00", "12:10–12:30"];
const EMOJI = {"Разговоры о важном": "💬", "Химия": "⚗️", "Геометрия": "📐", "Биология": "🌱", "Русский язык": "📖", "Русский язык в формате ЕГЭ": "📝", "Индивидуальный проект": "🚀", "Иностранный язык (англ.)": "🇬🇧", "Русский язык: теория и практика": "📖", "Алгебра и начала математического анализа": "🔢", "ОБЗР": "🛡️", "История": "🏛️", "Физическая культура": "⚽", "В/Д Семьеведение": "🏠", "Литература": "📚", "География": "🌍", "Вероятность и статистика": "📊", "Модуль «Футбол для всех»": "⚽", "Россия — мои горизонты": "🇷🇺", "Информатика": "💻", "Обществознание": "🤝", "Практикум по биологии": "🔬", "Физика": "⚛️"};
const DAYS = Object.keys(DATA);
const JS_DAYS = ["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
const now = new Date();
const today = JS_DAYS[now.getDay()];
let current = DATA[today] ? today : DAYS[0];

const tabs = document.getElementById('tabs');
const card = document.getElementById('card');
const chip = document.getElementById('chip');
DAYS.forEach(d=>{
  const b=document.createElement('button');
  b.className='tab'+(d===today?' is-today':'');
  b.textContent=d.slice(0,3).toUpperCase();
  b.title=d;
  b.onclick=()=>{current=d;render();};
  tabs.appendChild(b);
});

function minTo(str){const[a,b]=str.split(':').map(Number);return a*60+b;}
const startMin=minTo('8:30'), endMin=minTo('12:30');

function render(){
  [...tabs.children].forEach((b,i)=>b.classList.toggle('active',DAYS[i]===current));
  const isToday = current===today && now.getDay()>=1 && now.getDay()<=5;
  chip.textContent = isToday ? '📌 Сейчас идёт: '+today : '📅 Сегодня: '+today+(today==='Суббота'||today==='Воскресенье'?' — выходной, уроки нет 🎉':'');
  const curMin = now.getHours()*60+now.getMinutes();
  card.innerHTML='';
  DATA[current].forEach((name,i)=>{
    if(name===null){const e=document.createElement('div');e.className='empty';e.textContent='— — —';card.appendChild(e);return;}
    const div=document.createElement('div');
    const t=TIMES[i];
    let live=false;
    if(isToday){const[s,e]=t.split('–').map(minTo);live=curMin>=s&&curMin<e;}
    if(live)div.className='lesson now';
    else{div.className='lesson';div.style.animationDelay=(i*40)+'ms';}
    div.innerHTML='<div class="num">'+(i+1)+'</div><div class="l-main"><div class="l-name">'+(EMOJI[name]||'📘')+' '+name+'</div><div class="l-time"><b>'+t+'</b></div></div>'+(live?'<span class="now-tag">Сейчас</span>':'');
    card.appendChild(div);
  });
  const fill=document.getElementById('fill'),val=document.getElementById('p-val'),lab=document.getElementById('p-label');
  if(isToday){
    let p=Math.round((curMin-startMin)/(endMin-startMin)*100);
    p=Math.max(0,Math.min(100,p));
    fill.style.width=p+'%';val.textContent=p+'%';
    lab.textContent = p>=100 ? 'Уроки на сегодня закончились! Отдыхайте 🎉' : 'Учебный день пройден на';
  }else{fill.style.width='0%';val.textContent='—';lab.textContent='Учебный день пройден на';}
}
render();
</script>
</body>
</html>
