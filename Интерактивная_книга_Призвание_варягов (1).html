<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,serif;background:#2b2118;color:#f3e9d2;min-height:100vh}
#app{max-width:720px;margin:0 auto;padding:16px}
.page{display:none;background:#f3e9d2;color:#3a2c1a;border-radius:12px;padding:24px 20px;box-shadow:0 6px 24px rgba(0,0,0,.5);animation:fade .4s}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:26px;color:#7a3b12;text-align:center;margin-bottom:6px}
h2{font-size:22px;color:#7a3b12;margin-bottom:12px}
.sub{text-align:center;font-style:italic;color:#8a6d3b;margin-bottom:14px}
p{line-height:1.55;margin-bottom:10px;font-size:16px}
.lead{font-style:italic;border-left:4px solid #b8860b;padding:8px 12px;background:#efe2c4;border-radius:6px;margin:10px 0}
.btn{display:inline-block;background:#7a3b12;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:16px;cursor:pointer;font-family:inherit;margin:4px 4px 4px 0}
.btn:hover{background:#93501d}
.btn.small{padding:6px 12px;font-size:14px}
.nav{display:flex;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.center{text-align:center}
figure{margin:10px 0;text-align:center}
figcaption{font-size:13px;color:#6b5433;font-style:italic}
svg{max-width:100%;height:auto;border-radius:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}
.card{background:#efe2c4;border:2px solid #b8860b;border-radius:10px;padding:10px;cursor:pointer;text-align:center;transition:transform .15s}
.card:hover{transform:scale(1.04)}
.card b{display:block;color:#7a3b12;font-size:18px}
.card span{font-size:13px}
.quiz{background:#efe2c4;border-radius:8px;padding:12px;margin:10px 0}
.quiz p.q{font-weight:bold;margin-bottom:8px}
.ans{display:inline-block;background:#fff;border:2px solid #b8860b;border-radius:6px;padding:6px 14px;margin:4px;cursor:pointer;font-family:inherit;font-size:15px}
.ans.ok{background:#c8e6c9;border-color:#2e7d32}
.ans.no{background:#ffcdd2;border-color:#c62828}
.exp{font-size:14px;color:#4a3a20;margin-top:6px;display:none}
.fill{display:inline-block;min-width:110px;border-bottom:2px solid #7a3b12;padding:0 6px;font-weight:bold;color:#7a3b12}
input.fillin{border:none;border-bottom:2px solid #7a3b12;background:transparent;font-family:inherit;font-size:16px;color:#3a2c1a;width:130px;text-align:center;outline:none}
#score{font-size:18px;font-weight:bold;color:#7a3b12}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#7a3b12;color:#fff;padding:10px 20px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.silence{font-size:13px;color:#8a6d3b;text-align:center;margin-top:8px}
@keyframes chime{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
.ring{animation:chime .5s}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
const A=window.speechSynthesis;
function speak(t){try{if(A){A.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';u.rate=.95;A.speak(u);}}catch(e){}}
function beep(ok){try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type=ok?'sine':'sawtooth';o.frequency.value=ok?660:180;g.gain.setValueAtTime(.15,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.4);o.start();o.stop(c.currentTime+.4);}catch(e){}}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}

const PAGES=[
{t:'cover',html:`<h1>Призвание варягов</h1><div class="sub">Интерактивная книга по истории России · 6 класс · § 4</div>
<figure><svg viewBox="0 0 400 200" width="100%"><rect width="400" height="200" fill="#1d3557"/><path d="M0,140 Q100,120 200,135 T400,130 L400,200 L0,200 Z" fill="#457b9d"/><path d="M40,90 Q120,60 200,85 T360,80 L360,95 Q250,105 150,95 L40,105 Z" fill="#f4a261" opacity=".8"/><path d="M60,150 l14,-8 l14,8 l-14,8 Z" fill="#e9c46a"/><path d="M300,155 l14,-8 l14,8 l-14,8 Z" fill="#e9c46a"/><path d="M180,145 l14,-8 l14,8 l-14,8 Z" fill="#e9c46a"/><text x="200" y="40" text-anchor="middle" fill="#f3e9d2" font-size="18" font-style="italic">«Земля наша велика и обильна…»</text></svg>
<figcaption>Драккары варягов идут по пути «из варяг в греки»</figcaption></figure>
<p class="lead">862 год. Племена чуди, словен, кривичей и веси отправляют послов за море: «Приходите княжить и владеть нами». С этой строки летописи начинается история государства Русь.</p>

<div class="silence">Звук включится после первого нажатия любой кнопки</div>`},

{t:'Глава 1. Кто такие варяги',s:'Варяги — отважные мореходы с севера Европы. Со Скандинавии, из земель шведов и норвежцев, они приходили на драккарах — быстроходных ладьях с резными головами драконов. Варяги были воинами и торговцами. По рекам Восточной Европы пролегал великий водный путь из варяг в греки: из Балтийского моря — по Неве, Ладоге, Волхову, затем волоком — в Днепр — и до самого Константинополя, столицы Византии. Славянские племена нанимали варягов как опытных воинов для охраны караванов и походов. Так северные мореходы и славянские земли оказались связаны сотнями нитей — торговых, военных, родственных.',html:`<h2>Глава 1. Кто такие варяги</h2><p>Варяги — отважные мореходы с севера Европы. Со Скандинавии они приходили на своих драккарах — быстроходных ладьях с резными головами драконов. Варяги были воинами и торговцами.</p><p>По рекам Восточной Европы пролегал великий водный <b>путь «из варяг в греки»</b>: из Балтийского моря — по Неве, Ладоге, Волхову, затем волоком — на Днепр — и до самого Константинополя, столицы Византии.</p><p>Славянские племена нанимали варягов как опытных воинов для охраны караванов и дальних походов. Так северные мореходы и славянские земли оказались связаны сотнями нитей — торговых, военных, родственных.</p><div class="lead">Запомни: <b>варяги</b> — выходцы из Северной Европы, воины и торговцы, которых приглашали на службу.</div>`},

{t:'Глава 2. Порядка в земле нет',s:'К девятому веку у восточных славян выросли города: Киев, Ладога, Новгород, Смоленск. Сложились два центра: северный — Славия, земли ильменских словен и кривичей у озера Ильмень, и южный — Куяба, средний Днепр вокруг Киева. Племена чудь, словене, кривичи и весь платили дань варягам, но затем восстали и изгнали их за море. Однако согласия не наступило: встал род на род, град на град — начались усобицы. Кто торговал — тот воевал, кто собирал дань — тот обижал соседа. И тогда старейшины задумались: нужен ли нам правитель, который судит по праву?',html:`<h2>Глава 2. Порядка в земле нет</h2><p>К IX веку у восточных славян выросли города: Киев, Ладога, Новгород, Смоленск. Сложились <b>два центра</b>: северный — Славия (земли ильменских словен и кривичей у озера Ильмень) и южный — Куяба (средний Днепр, вокруг Киева).</p><p>Племена чудь, словене, кривичи и весь платили дань варягам, но затем восстали и изгнали их за море. Однако согласия не наступило: <b>«встал род на род»</b> — начались усобицы.</p><div class="lead">«…и не было в них правды, и встал род на род, и стали они воевать сами с собой» — так говорит летопись.</div><p>И тогда старейшины задумались: нужен ли нам правитель, который судит по праву?</p>`},

{t:'Глава 3. Призвание варягов',s:'В восемьсот шестьдесят втором году послы от чуди, словен, кривичей и веси отправились к варягам, к руси. И сказали они знаменитые слова: земля наша велика и обильна, а наряда в ней нет — порядка в ней нет. Приходите княжить и владеть нами. И избрались три брата: Рюрик сел княжить в Новгороде, Синеус — на Белоозере, Трувор — в Изборске. С Рюрика началась династия Рюриковичей, которая правила Русью более семи веков — до конца шестнадцатого столетия. Год призвания Рюрика историки считают датой образования государства Русь.',html:`<h2>Глава 3. Призвание варягов</h2>
<div class="lead">«Земля наша велика и обильна, а наряда (порядка) в ней нет. Приходите княжить и владеть нами»</div><p>В 862 году послы от чуди, словен, кривичей и веси отправились к варягам-руси. И избрались <b>три брата</b>:</p><div class="cards"><div class="card" onclick="speak('Рюрик сел княжить в Новгороде в восемьсот шестьдесят втором году. С него началась династия Рюриковичей.')"><b>Рюрик</b><span>княжил в Новгороде, 862—879</span></div><div class="card" onclick="speak('Синеус сел княжить на Белоозере.')"><b>Синеус</b><span>Белоозеро</span></div><div class="card" onclick="speak('Трувор сел княжить в Изборске.')"><b>Трувор</b><span>Изборск</span></div></div><p>С Рюрика началась династия Рюриковичей, правившая Русью более семи веков. Год 862-й историки считают <b>датой образования государства Русь</b>.</p>`},

{t:'Карта. Путь «из варяг в греки»',s:'Перед вами путь из варяг в греки. От Балтийского моря по Неве к Ладожскому озеру, вверх по Волхову в Новгород — где сел Рюрик. Дальше волоком на юг, по Днепру через Смоленск — и в Киев, будущую мать городов русских, и вниз к Чёрному морю, к Константинополю. По этому пути шли товары: северные меха, воск и мёд — на юг; византийские ткани, вино и украшения — на север. Кто владел путём — тот владел богатством и властью.',html:`<h2>🗺️ Карта. Путь «из варяг в греки»</h2>

{t:'Портретная галерея',s:'Перед вами портретная галерея первых правителей Руси. Рюрик — основатель династии, княжил в Новгороде с восемьсот шестьдесят второго по восемьсот семьдесят девятый год. Его братья Синеус и Трувор сели на Белоозере и в Изборске. После смерти Рюрика власть перешла к его родственнику Олегу — князю, который в восемьсот восемьдесят втором году захватил Киев и объединил северную и южную Русь. Олег сказал: Киев будет матерью городам русским. Он совершил успешный поход на Константинополь в девятьсот седьмом году и заключил первый письменный договор Руси с Византией в девятьсот одиннадцатом.',html:`<h2>🖼️ Портретная галерея правителей</h2>

<figcaption>Нажмите на портрет — услышите рассказ о князе</figcaption></figure>
<div class="cards"><div class="card" onclick="speak('Рюрик — основатель династии Рюриковичей. Призван княжить в Новгород в восемьсот шестьдесят втором году. Правил до восьмисот семьдесят девятого года.')"><b>Рюрик</b><span>Нажми — расскажу</span></div><div class="card" onclick="speak('Князь Олег в восемьсот восемьдесят втором году захватил Киев, сказав: Киев будет матерью городам русским. В девятьсот седьмом году он совершил поход на Константинополь, а в девятьсот одиннадцатом заключил первый письменный договор Руси с Византией.')"><b>Олег</b><span>Нажми — расскажу</span></div></div>`},

{t:'Глава 4. Спор учёных',s:'Летопись о призвании варягов породила знаменитый исторический спор. Норманисты считали: государство Руси создали скандинавы — варяги. Антинорманисты отвечали: государственность у славян зародилась сама, а имя Русь — от реки Рось. Современные учёные пришли к выводу: восточные славяне сами создали своё государство — города, торговля и племенные союзы уже сложились. А призвание варягов лишь ускорило процесс: славяне пригласили профессионального правителя и дружину на службу, сохранив свои порядки. Государство Русь — результат развития самих славянских земель.',html:`<h2>Глава 4. Спор учёных</h2><p>Летопись о призвании варягов породила знаменитый спор историков:</p><div class="cards"><div class="card" onclick="speak('Норманисты считали, что государство на Руси создали скандинавы — варяги.')"><b>Норманисты</b><span>государство создали варяги</span></div><div class="card" onclick="speak('Антинорманисты считали, что государственность у славян зародилась сама, а имя Русь — от реки Рось.')"><b>Антинорманисты</b><span>государство создали сами славяне</span></div></div><p><b>Современный вывод:</b> восточные славяне сами создали своё государство — города, торговля и племенные союзы уже сложились. Призвание варягов лишь <b>ускорило</b> процесс: пригласили профессионального правителя и дружину на службу, сохранив свои порядки.</p><div class="lead">Запомни: государство Русь — результат развития самих славянских земель.</div>`},

{t:'Глава 5. Олег и полюдье',s:'После смерти Рюрика в восемьсот семьдесят девятом году власть перешла к князю Олегу. В восемьсот восемьдесят втором году Олег занял Киев и объединил северную и южную Русь: с той поры Киев стал матерью городам русским. Каждый год князь с дружиной объезжал подвластные земли — собирал дань мехами, мёдом, воском и зерном, судил и управлял. Это называлось полюдьем. В девятьсот седьмом году Олег совершил поход на Константинополь, а в девятьсот одиннадцатом Русь заключила первый письменный договор с Византией. Молодое государство заявило о себе на всю Европу.',html:`<h2>Глава 5. Олег и полюдье</h2><p>После смерти Рюрика (879 г.) власть перешла к <b>князю Олегу</b>. В 882 году он занял Киев и объединил северную и южную Русь:</p><div class="lead">«Киев — мать городам русским»</div><p>Каждый год князь с дружиной объезжал подвластные земли — собирал <b>дань</b> (мех, мёд, воск, зерно), судил и управлял. Это называлось <b>полюдьем</b>.</p><p>907 год — успешный поход Олега на Константинополь. 911 год — <b>первый письменный договор</b> Руси с Византией.</p><div class="lead">Запомни: <b>полюдье</b> — ежегодный объезд князем с дружиной подвластных земель для сбора дани.</div>`},

{t:'Лента времени',s:'Рассмотрим ленту времени. Восемьсот шестьдесят второй год — призвание Рюрика, дата образования государства Русь. Восемьсот семьдесят девятый — смерть Рюрика. Восемьсот восемьдесят второй — Олег объединяет Новгород и Киев. Девятьсот седьмой — поход Олега на Константинополь. Девятьсот одиннадцатый — первый письменный договор Руси с Византией.',html:`<h2>⏳ Лента времени</h2>
<figure><svg viewBox="0 0 460 110" width="100%"><line x1="10" y1="55" x2="450" y2="55" stroke="#7a3b12" stroke-width="4"/>
<g onclick="speak('Восемьсот шестьдесят второй год — призвание Рюрика. Историки считают эту дату образованием государства Русь.')" style="cursor:pointer"><circle cx="60" cy="55" r="12" fill="#c62828"/><text x="60" y="34" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a3b12">862</text><text x="60" y="90" text-anchor="middle" font-size="9" fill="#3a2c1a">призвание</text></g>
<g onclick="speak('Восемьсот семьдесят девятый год — смерть Рюрика.')" style="cursor:pointer"><circle cx="145" cy="55" r="10" fill="#7a3b12"/><text x="145" y="34" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a3b12">879</text><text x="145" y="90" text-anchor="middle" font-size="9" fill="#3a2c1a">смерть Рюрика</text></g>
<g onclick="speak('Восемьсот восемьдесят второй год — Олег объединил Новгород и Киев.')" style="cursor:pointer"><circle cx="230" cy="55" r="12" fill="#c62828"/><text x="230" y="34" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a3b12">882</text><text x="230" y="90" text-anchor="middle" font-size="9" fill="#3a2c1a">объединение</text></g>
<g onclick="speak('Девятьсот седьмой год — поход Олега на Константинополь.')" style="cursor:pointer"><circle cx="315" cy="55" r="10" fill="#7a3b12"/><text x="315" y="34" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a3b12">907</text><text x="315" y="90" text-anchor="middle" font-size="9" fill="#3a2c1a">поход на Царьград</text></g>
<g onclick="speak('Девятьсот одиннадцатый год — первый письменный договор Руси с Византией.')" style="cursor:pointer"><circle cx="400" cy="55" r="10" fill="#7a3b12"/><text x="400" y="34" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a3b12">911</text><text x="400" y="90" text-anchor="middle" font-size="9" fill="#3a2c1a">договор с Византией</text></g>
</svg><figcaption>Нажмите на дату — прозвучит рассказ</figcaption></figure>`},

{t:'Тренажёр «Верю — не верю»',html:`<h2>🎮 Тренажёр «Верю — не верю»</h2><div id="quiz"></div><p id="score" class="center"></p>`},

{t:'Собери понятия',html:`<h2>✍️ Собери понятия</h2><p>Впишите слова и даты. Проверьте себя!</p>
<div class="quiz">1. Выходцы из Северной Европы, воины и торговцы — <input class="fillin" data-a="варяги"></div>
<div class="quiz">2. Ежегодный объезд князем с дружиной подвластных земель для сбора дани — <input class="fillin" data-a="полюдье"></div>
<div class="quiz">3. Платёж покорённых племён (мех, мёд, воск) — <input class="fillin" data-a="дань"></div>
<div class="quiz">4. Князь, призванный в 862 году в Новгород — <input class="fillin" data-a="рюрик"></div>
<div class="quiz">5. Дата призвания Рюрика (год) — <input class="fillin" data-a="862"></div>
<div class="quiz">6. Кто объединил Новгород и Киев в 882 году? — <input class="fillin" data-a="олег"></div>
<div class="center"><button class="btn" onclick="check()">Проверить</button></div><p id="fillres" class="center" style="font-weight:bold"></p>`},

{t:'Финал',s:'Подведём итог. В восемьсот шестидесят втором году племена чуди, словен, кривичей и веси призвали варягов, и Рюрик сел княжить в Новгороде. Этот год считается датой образования государства Русь. В восемьсот восемьдесят втором году князь Олег объединил Новгород и Киев. Современные учёные считают: государство создали сами восточные славяне, а призвание варягов лишь ускорило этот процесс. Домашнее задание: базовый уровень — прочитать параграф четвёртый, ответить на вопросы один — три. Повышенный — рассказать, как шёл спор норманистов и антинорманистов. Творческое — нарисовать иллюстрацию к преданию или написать письмо послов к варягам. Спасибо за внимание!',html:`<h2>🏆 Финал: подведём итог</h2>
<p>Теперь вы знаете:</p><p>• <b>862 год</b> — призвание Рюрика, дата образования государства Русь;<br>• варяги — воины и торговцы Севера, приглашённые «княжить и судить по праву»;<br>• <b>882 год</b> — князь Олег объединил Новгород и Киев;<br>• современный вывод: государство создали сами славяне, варяги лишь ускорили процесс.</p>
<div class="lead">📚 Домашнее задание:<br>Базовый: § 4, вопросы 1–3.<br>Повышенный: устно рассказать о споре норманистов и антинорманистов.<br>Творческое: нарисовать иллюстрацию к преданию или составить «письмо послов к варягам».</div>
<div class="center"><button class="btn" onclick="go(0)">📖 Читать сначала</button></div>
<p class="silence">Книга построена по § 4 учебника «История России» (В. Р. Мединский, А. В. Торкунов), 6 класс.</p>`}
];

const QUIZ=[
{q:'Варяги — это славянские племена?',a:[['Нет, это выходцы из Северной Европы',1],['Да, жители Новгорода',0]],e:'Верно: варяги — воины и торговцы со Скандинавии.'},
{q:'862 год считается датой образования государства Русь?',a:[['Да',1],['Нет',0]],e:'Верно: год призвания Рюрика историки считают датой образования Руси.'},
{q:'Синеус сел княжить в Киеве?',a:[['Да',0],['Нет, на Белоозере',1]],e:'Верно: Синеус — на Белоозере, Трувор — в Изборске, Рюрик — в Новгороде.'},
{q:'«Повесть временных лет» записана сразу после событий 862 года?',a:[['Да',0],['Нет, много позже — в XII веке',1]],e:'Верно: летопись — предание, записанное через два с половиной века.'},
{q:'Кто объединил Новгород и Киев в 882 году?',a:[['Рюрик',0],['Князь Олег',1]],e:'Верно: Олег, сказавший «Киев — мать городам русским».'},
{q:'Полюдье — это…',a:[['сбор дани объездом князем с дружиной подвластных земель',1],['торговый путь в Византию',0]],e:'Верно: полюдье — ежегодный объезд для сбора дани.'}
];
let qi=0,score=0;

function render(n){qi=0;score=0;const p=PAGES[n];const d=document.getElementById('app');d.innerHTML=`<div class="page active"><div class="center" style="margin-bottom:8px"><button class="btn small" onclick="speakAll(${n})">🔊 Прослушать</button></div>${p.html}<div class="nav">${n>0?'<button class="btn" onclick="go('+(n-1)+')">← Назад</button>':'<span></span>'}${n<PAGES.length-1?'<button class="btn" onclick="go('+(n+1)+')">Дальше →</button>':''}</div></div>`;if(p.t==='Тренажёр «Верю — не верю»')showQ();window.scrollTo(0,0)}
function go(n){render(n)}
function speakAll(n){const p=PAGES[n];speak(p.t+(p.s?'.'+p.s:''));toast('Читаю вслух…')}
function showQ(){const box=document.getElementById('quiz');if(qi>=QUIZ.length){box.innerHTML='<div class="lead">🎉 Готово! Ваш результат: '+score+' из '+QUIZ.length+'</div><p>Отличная работа! Теперь пройдите «Собери понятия».</p>';speak('Тренажёр завершён. Ваш результат: '+score+' из '+QUIZ.length+'. Отличная работа!');return}
const q=QUIZ[qi];box.innerHTML=`<div class="quiz"><p class="q">Вопрос ${qi+1} из ${QUIZ.length}. ${q.q}</p><div>${q.a.map((x,i)=>`<button class="ans" onclick="pick(this,${x[1]})">${x[0]}</button>`).join('')}</div><p class="exp" id="exp"></p></div>`}
function pick(btn,ok){document.querySelectorAll('.ans').forEach(b=>b.disabled=true);btn.classList.add(ok?'ok':'no');if(ok){score++;beep(true)}else{beep(false);document.querySelectorAll('.ans')[0].classList.toggle('ok',QUIZ[qi].a[0][1]===1);document.querySelectorAll('.ans')[1].classList.toggle('ok',QUIZ[qi].a[1][1]===1)}
const e=document.getElementById('exp');e.style.display='block';e.textContent=QUIZ[qi].e;setTimeout(()=>{qi++;showQ()},ok?1600:2600)}
function check(){let ok=0;document.querySelectorAll('.fillin').forEach(i=>{const good=i.value.trim().toLowerCase()===i.dataset.a;if(good){ok++;i.style.borderBottomColor='#2e7d32'}else{i.style.borderBottomColor='#c62828'}});const r=document.getElementById('fillres');r.textContent='Верно: '+ok+' из 6';r.style.color=ok===6?'#2e7d32':'#c62828';beep(ok>=5);toast(ok===6?'Блестяще! 👏':'Есть ошибки — попробуйте ещё!')}
render(0);
</script>
</body>
</html>
